<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tonga — Key Statistics</title>
<style>
:root{
  --navy:#07195b;
  --navy2:#0b2e82;
  --blue:#0a67db;
  --blue2:#22a5f5;
  --cyan:#6bd0ff;
  --teal:#078d8a;
  --teal2:#1fb6a4;
  --ice:#eef8ff;
  --ink:#0b1f63;
  --muted:#60739a;
  --line:#cfe2f4;
  --card:#ffffff;
  --shadow:0 10px 28px rgba(20,66,137,.10);
}
*{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{
  font-family:Inter,Segoe UI,Arial,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 15% 0%,rgba(64,170,255,.11),transparent 28%),
    linear-gradient(180deg,#ffffff 0%,#f5fbff 60%,#eef8ff 100%);
}
.wrap{width:100%;padding:14px 14px 26px}

/* ---------- HERO ---------- */
.hero{
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
  margin-bottom:18px;
}
.hero-main,.source-box{
  position:relative;
  overflow:hidden;
  border:1px solid rgba(54,116,187,.16);
  border-radius:22px;
  box-shadow:var(--shadow);
}
.hero-main{
  min-height:170px;
  padding:24px 28px;
  background:
    linear-gradient(115deg,rgba(255,255,255,.99) 0%,rgba(252,254,255,.97) 50%,rgba(221,243,255,.92) 100%);
}
.hero-main:before{
  content:"";
  position:absolute;
  width:450px;height:450px;
  right:-170px;top:-220px;
  border-radius:50%;
  background:
    radial-gradient(circle at 40% 60%,rgba(32,155,244,.38),rgba(90,199,255,.16) 38%,rgba(255,255,255,0) 66%);
}
.hero-main:after{
  content:"";
  position:absolute;
  right:-20px;bottom:-38px;
  width:420px;height:120px;
  border-radius:50%;
  background:
    radial-gradient(ellipse at center,rgba(17,117,198,.20),rgba(25,157,218,.10) 50%,transparent 72%);
  transform:rotate(-5deg);
}
.hero h1{
  margin:4px 0 12px;
  font-size:44px;
  line-height:1.02;
  letter-spacing:-.8px;
  color:var(--navy);
  position:relative;z-index:1;
}
.hero p{
  margin:0;
  max-width:860px;
  font-size:15px;
  line-height:1.52;
  color:#35557f;
  position:relative;z-index:1;
}
.source-box{
  padding:18px 20px;
  background:
    linear-gradient(150deg,#ffffff 0%,#f1f9ff 62%,#e2f2ff 100%);
}
.source-box:before{
  content:"";
  position:absolute;right:-45px;bottom:-55px;width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle,rgba(25,145,237,.20),transparent 68%);
}
.kicker{
  text-transform:uppercase;
  letter-spacing:.9px;
  font-size:10px;
  font-weight:800;
  color:#5574a2;
  margin-bottom:6px;
}
.source-box strong{
  display:block;
  font-size:18px;
  color:var(--navy);
  margin-bottom:7px;
}
.source-list{
  font-size:12.4px;
  line-height:1.42;
  color:#3f5d88;
  position:relative;z-index:1;
}

/* ---------- SECTION SHELL ---------- */
.pillar{
  margin:18px 0;
  border-radius:23px;
  overflow:hidden;
  border:1px solid rgba(49,111,179,.12);
  box-shadow:var(--shadow);
  background:#fff;
}
.social{background:linear-gradient(180deg,#f8fcff 0%,#edf7ff 100%)}
.economic{background:linear-gradient(180deg,#fffdf7 0%,#fff6df 100%)}
.environment{background:linear-gradient(180deg,#f7fcf8 0%,#eaf7ed 100%)}

.pillar-head{
  position:relative;
  display:flex;
  align-items:center;
  gap:13px;
  min-height:70px;
  padding:10px 16px;
  overflow:hidden;
}
.social .pillar-head{
  background:linear-gradient(90deg,#0b63d7 0%,#1b9cf0 52%,#59c5f6 100%);
}
.economic .pillar-head{
  background:linear-gradient(90deg,#b56a08 0%,#e09118 55%,#f2b84b 100%);
}
.environment .pillar-head{
  background:linear-gradient(90deg,#237a4b 0%,#319b62 55%,#6fc58a 100%);
}
.pillar-head:before{
  content:"";
  position:absolute;inset:0 0 auto 0;height:48%;
  background:linear-gradient(180deg,rgba(255,255,255,.27),transparent);
}
.pillar-head:after{
  content:"";
  position:absolute;
  right:-45px;top:-60px;
  width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.22),transparent 68%);
}
.badge{
  width:52px;height:52px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  font-size:23px;
  color:#fff;
  background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.42);
  box-shadow:inset 0 1px rgba(255,255,255,.55),0 6px 14px rgba(0,40,100,.18);
  position:relative;z-index:1;
}
.pillar h2{
  margin:0;
  color:white;
  font-size:28px;
  letter-spacing:-.3px;
  position:relative;z-index:1;
}
.tag,.strap{
  color:rgba(255,255,255,.96);
  font-size:12.5px;
  position:relative;z-index:1;
}
.strap{
  margin-left:auto;
  max-width:42%;
  text-align:right;
  font-weight:700;
}

/* ---------- CARDS ---------- */
.cards{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:11px;
  padding:13px;
}
.card{
  min-height:154px;
  position:relative;
  overflow:hidden;
  display:flex;
  gap:12px;
  align-items:flex-start;
  padding:14px 13px;
  border-radius:17px;
  border:1px solid rgba(45,108,181,.13);
  background:
    linear-gradient(145deg,rgba(255,255,255,.995),rgba(247,251,255,.98));
  box-shadow:0 7px 17px rgba(18,69,132,.07),inset 0 1px #fff;
}
.card:before{
  content:"";
  position:absolute;left:0;top:0;right:0;height:38%;
  background:linear-gradient(180deg,rgba(205,236,255,.30),transparent);
}
.card:after{
  content:"";
  position:absolute;
  right:-28px;bottom:-35px;width:105px;height:105px;border-radius:50%;
  background:radial-gradient(circle,rgba(37,151,240,.11),transparent 66%);
}
.environment .card:after{
  background:radial-gradient(circle,rgba(31,177,158,.12),transparent 66%);
}
.icon{
  width:50px;height:50px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  border-radius:16px;
  font-size:22px;
  color:#0a65cf;
  background:linear-gradient(145deg,#ffffff,#dceeff);
  border:1px solid rgba(36,117,205,.12);
  box-shadow:0 7px 15px rgba(21,102,183,.10),inset 0 1px #fff;
  position:relative;z-index:1;
}
.environment .icon{
  color:#087f79;
  background:linear-gradient(145deg,#ffffff,#d9f3ec);
}
.card-body{min-width:0;position:relative;z-index:1}
.label{
  font-size:12.4px;
  font-weight:800;
  line-height:1.23;
  color:#0c2460;
  margin-bottom:7px;
}
.value{
  font-size:clamp(20px,1.7vw,28px);
  line-height:1.04;
  font-weight:900;
  color:#071a59;
  letter-spacing:-.4px;
  white-space:nowrap;
}
.period{
  font-size:11.5px;
  line-height:1.32;
  color:#61769c;
  margin-top:7px;
}
.card-source{
  font-size:10px;
  line-height:1.24;
  color:#3d5d88;
  margin-top:8px;
}
.card-source a{color:#456fa6;text-decoration:none}

/* ---------- INFOGRAPHIC DIVIDERS ---------- */
.ribbon{
  margin:2px 13px 13px;
  display:flex;
  align-items:center;
  gap:14px;
  min-height:52px;
  border-radius:14px;
  padding:10px 14px;
  border:1px solid rgba(43,112,187,.10);
  background:
    linear-gradient(90deg,rgba(255,255,255,.92),rgba(231,246,255,.92),rgba(255,255,255,.92));
  color:#36567d;
  font-size:13px;
  line-height:1.4;
}
.environment .ribbon{
  background:linear-gradient(90deg,rgba(255,255,255,.92),rgba(224,247,241,.94),rgba(255,255,255,.92));
}
.ribbon .mini{
  display:flex;align-items:center;gap:8px;
  padding-right:14px;
  border-right:1px solid rgba(63,122,181,.13);
  font-weight:800;
  color:#0b2a66;
}
.ribbon .mini:last-child{border-right:0}
.ribbon .dot{
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#ecf7ff,#cfe9ff);
  color:#0b65cb;
  font-size:14px;
}
.environment .ribbon .dot{
  background:linear-gradient(145deg,#effaf8,#d4f1eb);
  color:#087b75;
}

/* ---------- VISUAL BLOCKS ---------- */
.visuals{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:12px;
  padding:0 13px 14px;
}
.visual{
  position:relative;
  overflow:hidden;
  border-radius:17px;
  border:1px solid rgba(45,110,181,.13);
  background:linear-gradient(145deg,#ffffff,#f6fbff);
  box-shadow:0 7px 17px rgba(18,69,132,.06);
  padding:15px 17px;
  min-height:238px;
}
.visual:before{
  content:"";
  position:absolute;
  right:-80px;top:-100px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(46,160,241,.10),transparent 70%);
}
.visual h3{
  margin:0 0 4px;
  font-size:20px;
  color:#0b1e5b;
}
.visual-sub{
  font-size:12.6px;
  color:#61769b;
  margin-bottom:12px;
}

/* visitor line */
.line-wrap{height:185px}
.line-svg{width:100%;height:100%;display:block}

/* trade donut */
.trade-wrap{
  display:grid;
  grid-template-columns:190px 1fr;
  gap:20px;
  align-items:center;
  min-height:175px;
}
.donut{
  width:170px;height:170px;border-radius:50%;
  position:relative;margin:auto;
  box-shadow:0 10px 24px rgba(16,87,165,.13),inset 0 1px #fff;
}
.donut:after{
  content:"";position:absolute;inset:34px;border-radius:50%;
  background:#fff;
  box-shadow:inset 0 0 0 1px rgba(49,109,180,.09);
}
.trade-lines{display:grid;gap:12px}
.trade-item{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;
  padding:11px 12px;
  border-radius:12px;
  background:linear-gradient(90deg,#eef7ff,#ffffff);
  border:1px solid rgba(45,111,183,.09);
  color:#36577f;
  font-size:13px;
}
.trade-item strong{
  font-size:19px;color:#091b59;
}
.trade-dot{
  width:10px;height:10px;border-radius:50%;
  display:inline-block;margin-right:8px;
}
.trade-dot.imports{background:#d88916}
.trade-dot.exports{background:#ffd27a}

/* footer */
.sources{
  margin-top:18px;
  padding:16px 9px 3px;
  display:flex;justify-content:space-between;gap:20px;
  border-top:1px solid rgba(47,109,180,.12);
  color:#526884;
  font-size:12.4px;
  line-height:1.42;
}
.error{
  margin:20px;padding:18px;border-radius:14px;
  border:1px solid #e7b5b5;background:#fff7f7;color:#7b2323
}

@media(max-width:1450px){
  .card{min-height:148px;padding:12px 10px;gap:8px}
  .icon{width:42px;height:42px;border-radius:14px;font-size:18px}
  .label{font-size:11.8px}
  .value{font-size:20px}
  .period{font-size:10.9px}
  .card-source{font-size:9.5px}
}
@media(max-width:900px){
  .hero{grid-template-columns:1fr}
  .cards{grid-template-columns:repeat(5,minmax(0,1fr))}
  .visuals{grid-template-columns:1fr}
  .strap{max-width:34%}
}
@media(max-width:820px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero h1{font-size:34px}
  .strap{display:none}
  .trade-wrap{grid-template-columns:1fr}
  .ribbon{flex-wrap:wrap}
}
@media(max-width:560px){
  .wrap{padding:10px 8px 22px}
  .cards{grid-template-columns:1fr}
  .pillar-head{flex-wrap:wrap}
  .hero-main{padding:20px}
  .sources{flex-direction:column}
}

/* Final refinement */
.icon svg,.badge svg{width:25px;height:25px;display:block}
.badge svg{width:27px;height:27px}
.hero-main .hero-art{position:absolute;right:22px;bottom:10px;width:300px;height:108px;z-index:0;opacity:.95}
.hero-main .hero-art svg{width:100%;height:100%;display:block}


/* ---------- SOCIAL + ENVIRONMENT BAR VISUALS ---------- */
.hbars{
  display:grid;
  gap:15px;
  margin-top:18px;
}
.hbar-row{
  display:grid;
  grid-template-columns:minmax(165px,210px) 1fr 62px;
  gap:12px;
  align-items:center;
}
.hbar-label{
  font-size:12.5px;
  font-weight:800;
  line-height:1.25;
  color:#29466f;
}
.hbar-track{
  height:17px;
  border-radius:999px;
  background:#e6eef7;
  overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(20,60,120,.08);
}
.hbar-fill{
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,#0b67d7,#49b9f3);
}
.environment .hbar-fill{
  background:linear-gradient(90deg,#078d8a,#6bcdbf);
}
.hbar-value{
  text-align:right;
  font-size:13px;
  font-weight:900;
  color:#0b1e5b;
}
.single-visual{
  grid-template-columns:minmax(0,1fr);
}
@media(max-width:620px){
  .hbar-row{
    grid-template-columns:1fr;
    gap:6px;
  }
  .hbar-value{text-align:left}
}




.visual-source-link{
  color:#456fa6;
  text-decoration:underline;
  text-underline-offset:2px;
  cursor:pointer;
}


/* ---------- PILLAR COLOR LOGIC ----------
   Social = blue | Economic = gold | Environment = green
*/
.economic .card{
  background:linear-gradient(145deg,#fffefb,#fff8e9);
  border-color:rgba(190,125,20,.16);
}
.economic .card:after{
  background:radial-gradient(circle,rgba(224,145,24,.12),transparent 66%);
}
.economic .icon{
  color:#b46b0b;
  background:linear-gradient(145deg,#fffefb,#ffedc8);
  border-color:rgba(190,125,20,.16);
}
.economic .visual{
  background:linear-gradient(145deg,#fffefb,#fff8e9);
  border-color:rgba(190,125,20,.15);
}
.economic .visual:before{
  background:radial-gradient(circle,rgba(224,145,24,.10),transparent 70%);
}
.economic .trade-item{
  background:linear-gradient(90deg,#fff5df,#ffffff);
  border-color:rgba(190,125,20,.11);
}

.environment .card{
  background:linear-gradient(145deg,#ffffff,#f3faf5);
  border-color:rgba(45,135,79,.14);
}
.environment .icon{
  color:#2b8654;
  background:linear-gradient(145deg,#ffffff,#dff3e5);
  border-color:rgba(45,135,79,.14);
}
.environment .visual{
  background:linear-gradient(145deg,#ffffff,#f2faf4);
  border-color:rgba(45,135,79,.14);
}
.environment .visual:before{
  background:radial-gradient(circle,rgba(57,159,94,.10),transparent 70%);
}
.environment .hbar-fill{
  background:linear-gradient(90deg,#2b8654,#70c58b);
}

</style>
</head>
<body>
<div id="app"></div>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));


function iconSvg(label, section){
  const stroke = section==="environment" ? "#2b8654" : section==="economic" ? "#b46b0b" : "#0a65cf";
  const common = `fill="none" stroke="${stroke}" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"`;
  const k = String(label||"").toLowerCase();

  if(k.includes("population by sex")) return `<svg viewBox="0 0 24 24"><circle ${common} cx="9" cy="7" r="3"/><path ${common} d="M9 10v8M6 14h6M16 4v6M13 7h6"/></svg>`;
  if(k==="population") return `<svg viewBox="0 0 24 24"><circle ${common} cx="8" cy="8" r="3"/><circle ${common} cx="16" cy="8" r="3"/><path ${common} d="M3 19c.6-3.5 2.4-5 5-5s4.4 1.5 5 5M11 19c.5-2.8 2.1-4 5-4 2.6 0 4.2 1.3 5 4"/></svg>`;
  if(k.includes("attendance")) return `<svg viewBox="0 0 24 24"><path ${common} d="M3 9l9-5 9 5-9 5-9-5z"/><path ${common} d="M7 12v5c3 2 7 2 10 0v-5M21 10v6"/></svg>`;
  if(k.includes("mortality")) return `<svg viewBox="0 0 24 24"><path ${common} d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>`;
  if(k.includes("poverty")) return `<svg viewBox="0 0 24 24"><path ${common} d="M4 11l8-6 8 6v8H4z"/><path ${common} d="M9 19v-5h6v5"/></svg>`;
  if(k.includes("gdp")) return `<svg viewBox="0 0 24 24"><path ${common} d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>`;
  if(k.includes("inflation")) return `<svg viewBox="0 0 24 24"><path ${common} d="M3 17l6-6 4 4 7-8"/><path ${common} d="M15 7h5v5"/></svg>`;
  if(k.includes("visitor")) return `<svg viewBox="0 0 24 24"><path ${common} d="M3 13l18-5-18-5 4 5-4 5z"/><path ${common} d="M9 8v10"/></svg>`;
  if(k.includes("itc")) return `<svg viewBox="0 0 24 24"><path ${common} d="M4 18V9M10 18V5M16 18v-7M22 18H2"/><path ${common} d="M14 5h6v6"/></svg>`;
  if(k.includes("debt")) return `<svg viewBox="0 0 24 24"><rect ${common} x="4" y="4" width="16" height="16" rx="2"/><path ${common} d="M8 9h8M8 13h8M8 17h5"/></svg>`;
  if(k.includes("renewable")) return `<svg viewBox="0 0 24 24"><circle ${common} cx="12" cy="12" r="3.5"/><path ${common} d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>`;
  if(k.includes("drinking water")) return `<svg viewBox="0 0 24 24"><path ${common} d="M12 3S6 10 6 15a6 6 0 0 0 12 0c0-5-6-12-6-12z"/></svg>`;
  if(k.includes("marine special")) return `<svg viewBox="0 0 24 24"><path ${common} d="M3 12c4-5 10-5 14 0-4 5-10 5-14 0z"/><path ${common} d="M17 12l4-3v6l-4-3z"/><circle cx="8" cy="11" r="1" fill="${stroke}"/></svg>`;
  if(k.includes("sea-level")) return `<svg viewBox="0 0 24 24"><path ${common} d="M3 15c2-2 4-2 6 0s4 2 6 0 4-2 6 0M3 19c2-2 4-2 6 0s4 2 6 0 4-2 6 0M12 4v8M9 7l3-3 3 3"/></svg>`;
  if(k.includes("extreme weather")) return `<svg viewBox="0 0 24 24"><path ${common} d="M12 3l10 18H2L12 3z"/><path ${common} d="M12 9v5M12 18h.01"/></svg>`;
  return `<svg viewBox="0 0 24 24"><circle ${common} cx="12" cy="12" r="7"/></svg>`;
}

function sectionIcon(section){
  if(section==="social") return `<svg viewBox="0 0 24 24"><circle fill="none" stroke="white" stroke-width="2" cx="8" cy="8" r="3"/><circle fill="none" stroke="white" stroke-width="2" cx="16" cy="8" r="3"/><path fill="none" stroke="white" stroke-width="2" stroke-linecap="round" d="M3 19c.6-3.5 2.4-5 5-5s4.4 1.5 5 5M11 19c.5-2.8 2.1-4 5-4 2.6 0 4.2 1.3 5 4"/></svg>`;
  if(section==="economic") return `<svg viewBox="0 0 24 24"><path fill="none" stroke="white" stroke-width="2" stroke-linecap="round" d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>`;
  return `<svg viewBox="0 0 24 24"><path fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M5 18c8 0 13-5 14-13-8 1-13 6-14 13zM5 18c3-4 6-7 10-9"/></svg>`;
}

function sourceList(sources){return sources.map(esc).join(" · ");}

function card(c, section){
  return `<div class="card">
    <div class="icon">${iconSvg(c.label, section)}</div>
    <div class="card-body">
      <div class="label">${esc(c.label)}</div>
      <div class="value">${esc(c.value)}</div>
      <div class="period">${esc(c.period)}</div>
      <div class="card-source">Source: <a href="${esc(c.sourceUrl)}" target="_blank" rel="noopener">${esc(c.source)}</a></div>
    </div>
  </div>`;
}
function cards(arr, section){return `<div class="cards">${arr.map(c=>card(c,section)).join("")}</div>`;}

function pillar(cls,icon,title,tag,strap,inner){
  return `<section class="pillar ${cls}">
    <div class="pillar-head">
      <div class="badge">${sectionIcon(cls)}</div>
      <h2>${title}</h2>
      <div class="tag">${tag}</div>
      <div class="strap">${strap}</div>
    </div>
    ${inner}
  </section>`;
}

function ribbon(items){
  return `<div class="ribbon">${items.map(i=>`<div class="mini"><span class="dot">${i.icon}</span>${i.text}</div>`).join("")}</div>`;
}

function visitorLine(chart){
  const pts=chart.series;
  const w=720,h=170,padL=34,padR=25,padT=18,padB=30;
  const max=Math.max(...pts.map(x=>x.value),1);
  const x=i=>padL+i*(w-padL-padR)/(pts.length-1);
  const y=v=>padT+(h-padT-padB)*(1-v/max);
  const poly=pts.map((p,i)=>`${x(i)},${y(p.value)}`).join(" ");
  const grid=[0,.25,.5,.75,1].map(fr=>{
    const gy=padT+(h-padT-padB)*fr;
    return `<line x1="${padL}" y1="${gy}" x2="${w-padR}" y2="${gy}" stroke="#dce8f4" stroke-width="1"/>`;
  }).join("");
  const points=pts.map((p,i)=>`
    <circle cx="${x(i)}" cy="${y(p.value)}" r="4.5" fill="#d88916"/>
    <text x="${x(i)}" y="${Math.max(y(p.value)-10,12)}" text-anchor="middle" font-size="10.5" fill="#d88916" font-weight="700">${Number(p.value).toLocaleString()}</text>
    <text x="${x(i)}" y="${h-7}" text-anchor="middle" font-size="10.5" fill="#61769b">${esc(p.label)}</text>`).join("");
  return `<svg class="line-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    ${grid}
    <polyline points="${poly}" fill="none" stroke="#d88916" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    ${points}
  </svg>`;
}


function horizontalBarVisual(chart){
  if(!chart || !Array.isArray(chart.series)) return "";
  const sourceInline = chart.sourceUrl
    ? ` · Source: <a class="visual-source-link" href="${esc(chart.sourceUrl)}" target="_blank" rel="noopener">${esc(chart.source || "Source")}</a>`
    : "";
  return `<div class="visuals single-visual">
    <div class="visual">
      <h3>${esc(chart.title)}</h3>
      <div class="visual-sub">${esc(chart.subtitle)}${sourceInline}</div>
      <div class="hbars">
        ${chart.series.map(item=>`
          <div class="hbar-row">
            <div class="hbar-label">${esc(item.label)}</div>
            <div class="hbar-track">
              <div class="hbar-fill" style="width:${Math.max(0,Math.min(100,Number(item.value)||0))}%"></div>
            </div>
            <div class="hbar-value">${esc(item.display ?? item.value)}</div>
          </div>`).join("")}
      </div>
    </div>
  </div>`;
}

function economicVisuals(d){
  const visits=d.economic.charts?.[0];
  const trade=d.economic.charts?.[1];
  if(!visits || !trade) return "";
  const imp=trade.series.find(x=>x.label==="Imports")?.value||0;
  const exp=trade.series.find(x=>x.label==="Exports")?.value||0;
  const total=imp+exp||1;
  const impPct=imp/total*100;
  return `<div class="visuals">
    <div class="visual">
      <h3>${esc(visits.title)}</h3>
      <div class="visual-sub">${esc(visits.subtitle)}</div>
      <div class="line-wrap">${visitorLine(visits)}</div>
    </div>
    <div class="visual">
      <h3>${esc(trade.title)}</h3>
      <div class="visual-sub">${esc(trade.subtitle)}</div>
      <div class="trade-wrap">
        <div class="donut" style="background:conic-gradient(#d88916 0 ${impPct}%,#ffd27a ${impPct}% 100%)">
</div>
        <div class="trade-lines">
          <div class="trade-item"><span><span class="trade-dot imports"></span>Imports</span><strong>${esc(trade.series[0].display||trade.series[0].value)}</strong></div>
          <div class="trade-item"><span><span class="trade-dot exports"></span>Exports</span><strong>${esc(trade.series[1].display||trade.series[1].value)}</strong></div>
        </div>
      </div>
    </div>
  </div>`;
}

async function load(){
  try{
    const r=await fetch("data.json",{cache:"no-store"});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const d=await r.json();

    const socialInner = cards(d.social.cards, "social") + horizontalBarVisual(d.social.chart);

    const economicInner = cards(d.economic.cards, "economic") + economicVisuals(d);

    const environmentInner = cards(d.environment.cards, "environment") + horizontalBarVisual(d.environment.chart);

    document.getElementById("app").innerHTML=`
      <main class="wrap">
        <section class="hero">
          <div class="hero-main">
            <h1>${esc(d.meta.title)}</h1>
            <p>${esc(d.meta.subtitle)}</p>
            <div class="hero-art" aria-hidden="true">
              <svg viewBox="0 0 300 108">
                <defs>
                  <linearGradient id="sea" x1="0" x2="1">
                    <stop offset="0" stop-color="#8bdcff" stop-opacity=".12"/>
                    <stop offset="1" stop-color="#0f8fe8" stop-opacity=".34"/>
                  </linearGradient>
                  <linearGradient id="island" x1="0" x2="1">
                    <stop offset="0" stop-color="#2fb6a5" stop-opacity=".24"/>
                    <stop offset="1" stop-color="#0b7f90" stop-opacity=".38"/>
                  </linearGradient>
                </defs>
                <path d="M0 78 C55 58 99 86 155 69 C204 55 244 65 300 46 L300 108 L0 108 Z" fill="url(#sea)"/>
                <path d="M72 73 C105 49 150 46 189 67 C160 74 123 78 72 73 Z" fill="url(#island)"/>
                <path d="M121 59 C126 50 132 43 138 36 M136 51 C129 47 123 46 117 47 M136 47 C143 41 151 40 157 42"
                      fill="none" stroke="#087f90" stroke-opacity=".36" stroke-width="3" stroke-linecap="round"/>
              </svg>
            </div>
          </div>
        </section>

        ${pillar("social","👥","SOCIAL","People and communities in Tonga","Building a healthier, more inclusive and prosperous Tonga.",socialInner)}
        ${pillar("economic","▥","ECONOMIC","A resilient and connected economy","Supporting sustainable and inclusive economic growth.",economicInner)}
        ${pillar("environment","🍃","ENVIRONMENT","A resilient and sustainable Tonga","Protecting Tonga’s natural environment for future generations.",environmentInner)}

        <div class="sources">
          <div><strong>Official sources:</strong> ${sourceList(d.sources)}</div>
          <div><strong>Data file updated:</strong> ${esc(d.meta.lastUpdated)}</div>
        </div>
      </main>`;
  }catch(e){
    document.getElementById("app").innerHTML=
      `<div class="error"><strong>Could not load data.</strong><br>${esc(e.message)}<br><br>
      This page must be hosted beside <code>data.json</code>.</div>`;
  }
}
load();
</script>
